services:
  redis:
    image: redis:7-alpine
    container_name: foodya-redis
    # AOF persistence: popularity ZSET buckets are real data (35-day TTL),
    # not just cache - they must survive container restarts.
    # noeviction on purpose: this Redis also holds the token blacklist, and an
    # LRU policy could silently evict revoked tokens (logged-out tokens would
    # work again). If memory fills up, writes fail loudly instead.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - foodya-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend

    env_file:
      - .env

    environment:
      # Set cứng Timezone để log hiển thị đúng giờ Việt Nam
      - TZ=Asia/Ho_Chi_Minh

      # Đảm bảo Java nhận diện đúng giới hạn memory của Container (quan trọng khi deploy)
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0

      # Inside the compose network, Redis is reachable by service name, not localhost
      - REDIS_URL=redis://redis:6379

    ports:
      - "${SERVER_PORT:-8080}:8080"

    networks:
      - foodya-network

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    # Healthcheck: Đảm bảo container "healthy" mới nhận request
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  foodya-network:
    driver: bridge

volumes:
  redis-data:
