spring.application.name=backend

# ===== ENVIRONMENT VARIABLES IMPORT =====
# Resolves relative to the working directory, i.e. backend/.env when run from backend/
spring.config.import=optional:file:.env[.properties]

# ===== DATABASE CONFIGURATION =====
# Using environment variables for security
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# HikariCP configuration for Supabase
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSize=0

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
# Don't hold the DB connection open for the whole HTTP request; services are
# @Transactional and map entities to DTOs before returning, so views never lazy-load
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Dialect will be auto-detected based on database URL

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===== SQL INIT =====
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false

# ===== JWT CONFIGURATION =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-time=${JWT_EXPIRATION}
app.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION}

# ===== WEB AUTH COOKIE CONFIGURATION =====
# Refresh token is delivered to browsers as an HttpOnly cookie, scoped to /api/v1/auth.
# Secure=false only makes sense for local http:// dev; keep true everywhere else.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
# Leave unset for host-only cookies (default, recommended); set only to share
# the cookie across subdomains (e.g. ".foodya.com").
app.cookie.domain=${COOKIE_DOMAIN:}

# ===== CORS (web frontend origins allowed to send credentialed requests) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# ===== JSON CONFIGURATION =====
# Use ISO 8601 datetime format for better compatibility
# Supports: 2025-12-31T18:44:08 or 2025-12-31T18:44:08.123Z
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# ===== SERVER CONFIGURATION =====
# Same SERVER_PORT variable docker-compose uses for its port mapping
server.port=${SERVER_PORT:8080}

# Security - hide sensitive information in error responses
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===== LOGGING =====
logging.level.org.springframework.jdbc=${LOG_SPRING_JDBC}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL}

# ===== SWAGGER / OPENAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== REDIS =====
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2000
spring.data.redis.timeout=2000

# ===== ACTUATOR (for health checks) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


